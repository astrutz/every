<div class="max-w-2xl rounded">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="entry-id">ID</label>
      <div class="flex gap-2 items-center">
        <div class="grow">
          <input
            formControlName="id"
            id="entry-id"
            type="text"
            class="w-full border p-2 rounded text-black"
            placeholder="Entry ID" />
        </div>
        @if (form.controls['id'].value) {
          <button
            class="bg-gray-600 text-white px-4 rounded h-[stretch]"
            type="button"
            (click)="onSearch()">
            Search
          </button>
        }
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="entry-country">Country*</label>
      <input
        formControlName="country"
        id="entry-country"
        type="text"
        class="w-full border p-2 rounded text-black"
        placeholder="Country code with two letters, e.g. 'DE'" />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="entry-year">Year*</label>
      <input
        formControlName="year"
        id="entry-year"
        type="number"
        class="w-full border p-2 rounded text-black"
        placeholder="Contest Year" />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="entry-place">Place</label>
      <input
        formControlName="place"
        id="entry-place"
        type="number"
        class="w-full border p-2 rounded text-black"
        placeholder="Placement in the Contest" />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="entry-title">Title</label>
      <input
        formControlName="title"
        id="entry-title"
        type="text"
        class="w-full border p-2 rounded text-black"
        placeholder="Song Title" />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="entry-artist">Artist</label>
      <input
        formControlName="artist"
        id="entry-artist"
        type="text"
        class="w-full border p-2 rounded text-black"
        placeholder="Song Artist" />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1" for="entry-link">Link</label>
      <input
        formControlName="link"
        id="entry-link"
        type="text"
        class="w-full border p-2 rounded text-black"
        placeholder="YouTube Link" />
    </div>

    <div class="mb-4 flex gap-2">
      <div>
        <label class="block text-sm font-medium mb-1" for="entry-energyRating">Energy</label>
        <input
          formControlName="energyRating"
          id="entry-energyRating"
          type="number"
          class="w-full border p-2 rounded text-black"
          placeholder="1 - 10" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="entry-stagingRating">Staging</label>
        <input
          formControlName="stagingRating"
          id="entry-stagingRating"
          type="number"
          class="w-full border p-2 rounded text-black"
          placeholder="1 - 10" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="entry-studioRating">Studio</label>
        <input
          formControlName="studioRating"
          id="entry-studioRating"
          type="number"
          class="w-full border p-2 rounded text-black"
          placeholder="1 - 10" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="entry-funRating">Fun</label>
        <input
          formControlName="funRating"
          id="entry-funRating"
          type="number"
          class="w-full border p-2 rounded text-black"
          placeholder="1 - 10" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="entry-vocalsRating">Vocals</label>
        <input
          formControlName="vocalsRating"
          id="entry-vocalsRating"
          type="number"
          class="w-full border p-2 rounded text-black"
          placeholder="1 - 10" />
      </div>
    </div>

    <div class="flex justify-between items-center gap-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
        {{ form.get('id')?.value ? 'Update' : 'Create' }}
      </button>
      @if (totalRanking > 0) {
        <div class="self-center h-full">
          Total: {{ totalRanking.toLocaleString() }}
        </div>
      }
    </div>

    @if (state === 'saving') {
      <div class="mt-2 text-sm text-gray-600">Saving…</div>
    }
    @if (state === 'success') {
      <div class="mt-2 text-sm text-green-600">Success</div>
    }
    @if (state === 'error') {
      <div class="mt-2 text-sm text-red-600">{{ errorMessage }}</div>
    }
  </form>
</div>
