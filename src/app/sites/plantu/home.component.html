@let tasks = tasks$();
<every-content-area>
  <h1 class="text-2xl md:text-3xl mb-4 md:mb-8">Pflegeliste</h1>
  @if (tasks.length) {
    <div class="flex flex-col gap-4">
      @for (task of tasks; track task.day) {
        <h2 class="text-xl md:text-2xl">{{ getLocalDate(task.day) }}</h2>
        @for (plant of task.plants; track plant._id) {
          <plantu-card [plant]="plant" [targetDate]="task.day"></plantu-card>
        }
      }
    </div>
  }
</every-content-area>
