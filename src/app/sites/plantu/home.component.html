@let tasks = tasks$();
<every-content-area class="relative">
  <h1 class="text-2xl md:text-3xl mb-4 md:mb-8">Pflegeliste</h1>
  @if (tasks.length) {
    <div class="flex flex-col gap-4">
      @for (task of tasks; track task.day) {
        <h2 class="text-xl md:text-2xl">{{ getLocalDate(task.day) }}</h2>
        @for (plant of task.plants; track plant._id) {
          <plantu-card [plant]="plant" [targetDate]="task.day"></plantu-card>
        }
      }
    </div>
  }
</every-content-area>

@if (!basketService.isEmpty$()) {
  <div class="fixed end-6 bottom-6 flex gap-2 md:gap-4 justify-between">
    <button
      (click)="basketService.clear()"
      type="button"
      class="flex items-center justify-center text-white shadow-gray-400 dark:shadow-black shadow-lg bg-gray-400 rounded-full w-12 h-12 md:w-16 md:h-16 hover:bg-gray-500 dark:bg-gray-700 dark:hover:bg-gray-600">
      <span class="hidden md:flex items-center">
        <ng-icon class="m-auto" color="currentColor" size="2rem" name="lucideX"></ng-icon>
      </span>
      <span class="flex md:hidden items-center">
        <ng-icon color="currentColor" size="1.5rem" name="lucideX"></ng-icon>
        <span class="sr-only">Discard</span>
      </span>
    </button>
    <button
      type="button"
      class="flex items-center justify-center text-white shadow-gray-400 dark:shadow-black shadow-lg bg-sky-600 rounded-full w-12 h-12 md:w-16 md:h-16 hover:bg-sky-800 dark:bg-sky-600 dark:hover:bg-sky-700">
      <span class="hidden md:flex items-center">
        <ng-icon class="m-auto" color="currentColor" size="2rem" name="lucideCloudUpload"></ng-icon>
      </span>
      <span class="flex md:hidden items-center">
        <ng-icon color="currentColor" size="1.5rem" name="lucideCloudUpload"></ng-icon>
        <span class="sr-only">Save</span>
      </span>
    </button>
  </div>
}
