<dialog [id]="dialogId$()" class="top-16 bg-gray-100 dark:bg-gray-600 rounded-md">
  <div class="relative p-8 min-w-72 max-w-4xl w-fit">
    <ng-content></ng-content>
    <button
      command="close"
      [attr.commandfor]="dialogId$()"
      class="absolute right-4 top-4 hover:scale-110 transition-all duration-200">
      <ng-icon color="currentColor" size="1.5rem" name="lucideX"></ng-icon>
    </button>
  </div>
</dialog>
